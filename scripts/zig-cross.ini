# Meson cross file: build for x86_64-linux-musl with the zig toolchain.
# Used by scripts/Dockerfile.vips for every meson-based dependency (glib, libvips).
[binaries]
c = ['/usr/local/bin/zig', 'cc', '-target', 'x86_64-linux-musl', '-O3']
cpp = ['/usr/local/bin/zig', 'c++', '-target', 'x86_64-linux-musl', '-O3']
ar = ['/usr/local/bin/zig', 'ar']
ranlib = ['/usr/local/bin/zig', 'ranlib']
strip = ['/usr/local/bin/zig', 'strip']
pkg-config = 'pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
