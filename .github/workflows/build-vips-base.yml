name: Build and Publish vips Base Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "libvips version tag (default: from scripts/Dockerfile.vips)"
        required: false
        type: string

env:
  IMAGE: acherkrau/libvips-static

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve libvips version
        id: version
        run: |
          ver="${{ inputs.version }}"
          if [ -z "$ver" ]; then
            ver="$(sed -n 's/^ARG VIPS_VERSION=//p' scripts/Dockerfile.vips)"
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/Dockerfile.vips
          target: vips-base
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
